# Runs the poll cycle in the cloud so the site stays current whether or not any
# laptop is awake. Same run.sh the local launchd job uses.
#
# The working set is ~100 MB of accumulated EDGAR state and cannot be rebuilt
# from the repo, so it is carried between runs in the Actions cache and mirrored
# to Cloud Storage as the durable copy — a cache eviction then costs one slow
# run rather than the entire history.
name: poll

on:
  schedule:
    # Five minutes is the platform floor. Free now that the repo is public, so
    # the only reason to run less often would be politeness to sec.gov, and a
    # handful of conditional requests every five minutes is well inside their
    # fair-use guidance.
    # Split rather than "10-23,0-2": a comma-joined hour range is the kind of
    # thing cron parsers disagree about, and this schedule had not fired once.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 10-23 * * 1-5"
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 0-2 * * 1-5"
  workflow_dispatch:

concurrency:
  group: poll            # never two cycles writing the same state at once
  cancel-in-progress: false

permissions:
  contents: write        # the add path rebuilds and commits the page

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # No pip installs: the fast lane is pure standard library. The imaging
      # and market-data packages exist for the daily job and cost 107 seconds
      # of billable runner time to install, every single run.
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      # gcloud is preinstalled on the runner; setup-gcloud costs another 26s.

      - name: Restore working state
        id: cache
        uses: actions/cache@v4
        with:
          path: data
          key: virgil-state-${{ github.run_id }}
          restore-keys: virgil-state-

      - name: Seed from Cloud Storage if the cache was empty
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          mkdir -p data
          gcloud storage rsync -r gs://virgil-edgar/state data --quiet

      - name: Credentials
        run: |
          mkdir -p ~/.virgil && chmod 700 ~/.virgil
          printf 'DATABENTO_API_KEY=%s\n' "${{ secrets.DATABENTO_API_KEY }}" \
            > ~/.virgil/credentials
          chmod 600 ~/.virgil/credentials

      # No page build, so no render guard is needed and nothing is committed:
      # readers get their data from storage, and index.html only changes when
      # its own code does, which is the daily job's business.
      - name: Poll and publish live data
        env:
          CHROME: /usr/bin/chromium-browser
          FORCE: "1"
          SKIP_DAILY: "1"     # heavy scans belong to daily.yml
        run: |
          # fast.sh hands off to run.sh when a new investor needs the page
          # rebuilt, and that path commits, so it needs an identity and a server
          # for the render check.
          git config user.name  "boatmaninlavik"
          git config user.email "zsean0539@gmail.com"
          nohup python3 ui/serve.py 8770 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8770/ && break || sleep 1
          done
          ./fast.sh

      - name: Mirror state to Cloud Storage
        if: always()
        run: |
          gcloud storage rsync -r -x '.*\.(log|tmp)$' data \
            gs://virgil-edgar/state --quiet
