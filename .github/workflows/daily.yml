# The heavy half of the pipeline: market-wide Form 4 scans, 13F holdings,
# congressional PTRs, the metered price update, split adjustment, and the
# portrait and logo backfill. Tens of minutes, needed once a day.
#
# Kept out of poll.yml so a slow scan can never delay the fast lane, which is
# the part that decides how quickly a new filing reaches the site.
name: daily

on:
  schedule:
    - cron: "37 11 * * 1-5"           # 07:30 ET, after the prior session posts
  workflow_dispatch:

concurrency:
  group: poll            # shares the fast lane's group: same state            # never two cycles writing the same state at once
  cancel-in-progress: false

permissions:
  contents: write        # the rebuilt page is committed, which is what deploys

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy \
            cairosvg databento
          # zsh because run.sh is the same script the local job runs; rewriting
          # it for bash would mean two subtly different pipelines.
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
          sudo apt-get install -y -qq chromium-browser || \
            sudo apt-get install -y -qq chromium || true

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Restore working state
        id: cache
        uses: actions/cache@v4
        with:
          path: data
          key: virgil-state-${{ github.run_id }}
          restore-keys: virgil-state-

      # The bucket is the source of truth, always — not only on a cache miss.
      # The cache is just a local accelerator, and a stale one was being
      # mirrored back over newer state: funds that had already been added
      # silently disappeared again on the next cycle.
      - name: Take authoritative state from Cloud Storage
        run: |
          mkdir -p data
          gcloud storage rsync -r gs://virgil-edgar/state data --quiet

      - name: Credentials
        run: |
          mkdir -p ~/.virgil && chmod 700 ~/.virgil
          printf 'DATABENTO_API_KEY=%s\n' "${{ secrets.DATABENTO_API_KEY }}" \
            > ~/.virgil/credentials
          chmod 600 ~/.virgil/credentials

      - name: Serve the page so the render guard can run
        run: |
          nohup python3 ui/serve.py 8770 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8770/ && break || sleep 1
          done

      - name: Poll, build, publish
        env:
          CHROME: /usr/bin/chromium-browser
          FORCE: "1"          # the workflow's own schedule is the hours guard
        run: |
          git config user.name  "boatmaninlavik"
          git config user.email "zsean0539@gmail.com"
          ./run.sh

      - name: Mirror state to Cloud Storage
        if: always()
        run: |
          gcloud storage rsync -r -x '.*\.(log|tmp)$' data \
            gs://virgil-edgar/state --quiet
